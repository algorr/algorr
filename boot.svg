<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-label="umit.kar boot sequence">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .t  { fill: #6e7681; }
    .w  { fill: #c9d1d9; }
    .ok { fill: #3fb950; font-weight: 700; }
    .wr { fill: #d29922; font-weight: 700; }
    .hl { fill: #58a6ff; }
    .pr { fill: #3fb950; }
    .ln { opacity: 0; animation: in .25s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .cur { opacity: 0; animation: in .1s forwards 6.2s, blink 1s steps(1) infinite 6.3s; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(430px); } }
  </style>

  <defs>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="840" height="430" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="840" height="430" fill="#0d1117"/>
    <rect width="840" height="36" fill="#161b22"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="18" r="6" fill="#27c93f"/>
    <text x="420" y="23" text-anchor="middle" class="mono t" style="font-size:13px">archeus — tty1</text>

    <g class="mono">
      <text x="24" y="72"  class="ln" style="animation-delay:.2s"><tspan class="hl">ARCHEUS BIOS v1.0</tspan><tspan class="t">  ·  booting user </tspan><tspan class="w">umit.kar</tspan><tspan class="t"> from Konya, TR</tspan></text>

      <text x="24" y="108" class="ln" style="animation-delay:.8s"><tspan class="t">[    0.412] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Loaded kernel: electrical-electronics-engineer (BSc 2010)</tspan></text>
      <text x="24" y="134" class="ln" style="animation-delay:1.3s"><tspan class="t">[    1.087] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Mounted /var/log/career  (2010 → 2018, read-only)</tspan></text>
      <text x="24" y="160" class="ln" style="animation-delay:1.8s"><tspan class="t">[    1.903] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Started flutter.service, dart.service, firebase.service</tspan></text>
      <text x="24" y="186" class="ln" style="animation-delay:2.3s"><tspan class="t">[    2.640] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Mounted /apps  —  </tspan><tspan class="hl">9 AI apps shipped</tspan></text>
      <text x="24" y="212" class="ln" style="animation-delay:2.8s"><tspan class="t">[    3.118] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Started quest-mr.service  (hand tracking, no controllers)</tspan></text>
      <text x="24" y="238" class="ln" style="animation-delay:3.3s"><tspan class="t">[    3.774] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Started creature-rigger.service  (8 clicks → walking spider)</tspan></text>
      <text x="24" y="264" class="ln" style="animation-delay:3.8s"><tspan class="t">[    4.201] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Started esp32-desk-robot.service  (it talks back)</tspan></text>
      <text x="24" y="290" class="ln" style="animation-delay:4.4s"><tspan class="t">[    4.950] </tspan><tspan class="w">[</tspan><tspan class="wr">WARN</tspan><tspan class="w">] sleep.service: unit not found, skipping</tspan></text>
      <text x="24" y="316" class="ln" style="animation-delay:5.0s"><tspan class="t">[    5.333] </tspan><tspan class="w">[ </tspan><tspan class="ok">OK</tspan><tspan class="w"> ] Reached target </tspan><tspan class="hl">archeus-os.target</tspan></text>

      <text x="24" y="360" class="ln" style="animation-delay:5.7s"><tspan class="t">Do not chase the butterflies, make your garden beautiful.</tspan></text>

      <text x="24" y="398" class="ln" style="animation-delay:6.0s"><tspan class="pr">umit@konya</tspan><tspan class="w">:</tspan><tspan class="hl">~</tspan><tspan class="w">$ </tspan></text>
      <rect x="152" y="385" width="9" height="17" fill="#c9d1d9" class="cur"/>
    </g>

    <rect class="scan" x="0" y="0" width="840" height="40" fill="url(#scanG)"/>
  </g>
</svg>
